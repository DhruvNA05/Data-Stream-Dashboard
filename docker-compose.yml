services:
    kafka:
        image: apache/kafka:4.3.1
        container_name: kafka
        ports:
            # Host machine talks to Kafka on localhost:9092.
            - "9092:9092"
        environment:
            # --- KRaft mode settings (no Zookeeper needed) ---
            - KAFKA_NODE_ID=1
            - KAFKA_PROCESS_ROLES=broker,controller
            - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
            - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER

            # --- Listener setup ---
            # PLAINTEXT -> used by containers on the same docker network (e.g. kafka-ui)
            # CONTROLLER -> internal KRaft consensus traffic
            # PLAINTEXT_HOST -> used by your host machine (Python scripts, etc.)
            - KAFKA_LISTENERS=PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
            - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
            - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT

            # Single-node dev settings (would be higher in a real cluster)
            - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
            - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
        volumes:
            - kafka_data:/var/lib/kafka/data
        networks:
            - kafka-net
        healthcheck:
            test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            interval: 10s
            timeout: 10s
            retries: 5
    kafka-ui:
        image: kafbat/kafka-ui:main
        container_name: kafka-ui
        ports:
            - "8080:8080"
        environment:
            - KAFKA_CLUSTERS_0_NAME=local
            # kafka-ui lives on the same docker network, so it uses the internal
            # PLAINTEXT listener (kafka:19092), not the PLAINTEXT_HOST one your host uses.
            - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:19092
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - kafka-net
    producer:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: producer
        command: python producer.py
        environment:
            - KAFKA_BROKER = kafka:19092
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - kafka-net
    consumer:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: consumer
        command: uvicorn consumer:app --host 0.0.0.0 --port 8000
        ports:
            - "8000:8000"
        environment:
            - KAFKA_BROKER = kafka:19092
        depends_on:
            kafka:
                condition: service_healthy
        networks:
            - kafka-net
    frontend:
        build: ./app/frontend
        container_name: frontend
        ports:
            - "5173:5173"
        networks:
            - kafka-net
volumes:
    kafka_data:

networks:
    kafka-net:
        driver: bridge